<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKA EduCore - Système Intégré de Gestion Scolaire (RDC)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React, ReactDOM & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Outfit', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- DONNÉES DE DÉPART (RDC - KINSHASA) ---
    const INITIAL_SETTINGS = {
      name: "COMPLEXE SCOLAIRE LES VAILLANTS",
      motto: "Discipline - Travail - Succès",
      address: "14, Avenue de la Paix, Q/Socimat, Gombe",
      city: "Kinshasa",
      country: "RDC",
      phone: "+243 81 555 0192",
      email: "direction@lesvaillants.cd",
      activeAcademicYear: "2025-2026",
      currentPeriod: "1ère Période",
      currency: "USD",
      exchangeRate: 2800, // 1 USD = 2800 CDF
      nationalApprovalNumber: "MINEPST/CABMIN/042/2022"
    };

    const INITIAL_STUDENTS = [
      { id: '1', matricule: '2025-MS-001', name: 'KASONGO MUKENDI Daniel', gender: 'M', classId: 'c1', className: '8ème Éducation de Base A', status: 'ACTIF', parent: 'Dr. Mukendi', phone: '+243 82 100 2000', tuitionUSD: 150, paidUSD: 150, balanceUSD: 0 },
      { id: '2', matricule: '2025-MS-002', name: 'MUTOMBO TSHILOMBA Sarah', gender: 'F', classId: 'c1', className: '8ème Éducation de Base A', status: 'ACTIF', parent: 'Mme Tshilomba', phone: '+243 81 222 3344', tuitionUSD: 150, paidUSD: 75, balanceUSD: 75 },
      { id: '3', matricule: '2025-MS-003', name: 'LUKUSA KABEYA Jonathan', gender: 'M', classId: 'c2', className: '1ère Scientifique (Bio-Chimie)', status: 'ACTIF', parent: 'Ing. Lukusa', phone: '+243 99 888 7766', tuitionUSD: 180, paidUSD: 0, balanceUSD: 180 },
      { id: '4', matricule: '2025-MS-004', name: 'MBALA NGANDU Grace', gender: 'F', classId: 'c2', className: '1ère Scientifique (Bio-Chimie)', status: 'ACTIF', parent: 'Pasteur Mbala', phone: '+243 85 444 3322', tuitionUSD: 180, paidUSD: 180, balanceUSD: 0 },
      { id: '5', matricule: '2025-MS-005', name: 'BOKONGO ITELA Moïse', gender: 'M', classId: 'c3', className: '2ème Commerciale & Gestion', status: 'ACTIF', parent: 'M. Bokongo', phone: '+243 89 777 6655', tuitionUSD: 180, paidUSD: 90, balanceUSD: 90 },
      { id: '6', matricule: '2025-MS-006', name: 'KALONJI KANYINDA Esther', gender: 'F', classId: 'c3', className: '2ème Commerciale & Gestion', status: 'ACTIF', parent: 'Mme Kanyinda', phone: '+243 81 333 2211', tuitionUSD: 180, paidUSD: 180, balanceUSD: 0 }
    ];

    const INITIAL_PAYMENTS = [
      { id: 'p1', ref: 'REC-2025-0101', studentName: 'KASONGO MUKENDI Daniel', className: '8ème EB-A', motif: 'Frais Scolaires T1', amount: 150, currency: 'USD', method: 'M-Pesa', date: '12/02/2026' },
      { id: 'p2', ref: 'REC-2025-0102', studentName: 'MUTOMBO TSHILOMBA Sarah', className: '8ème EB-A', motif: 'Acompte T1', amount: 210000, currency: 'CDF', method: 'Espèces', date: '14/02/2026' },
      { id: 'p3', ref: 'REC-2025-0103', studentName: 'MBALA NGANDU Grace', className: '1ère Sc-A', motif: 'Frais Scolaires T1', amount: 180, currency: 'USD', method: 'Airtel Money', date: '15/02/2026' },
      { id: 'p4', ref: 'REC-2025-0104', studentName: 'KALONJI KANYINDA Esther', className: '2ème CG', motif: 'Frais Scolaires T1', amount: 180, currency: 'USD', method: 'Banque (Rawbank)', date: '16/02/2026' }
    ];

    const INITIAL_CLASSES = [
      { id: 'c1', name: '8ème Éducation de Base A', code: '8EB-A', section: 'Education de Base', titular: 'Prof. Ilunga', studentsCount: 38, capacity: 45 },
      { id: 'c2', name: '1ère Scientifique (Bio-Chimie)', code: '1SC-A', section: 'Humanités Scientifiques', titular: 'Prof. Kabeya', studentsCount: 32, capacity: 40 },
      { id: 'c3', name: '2ème Commerciale & Gestion', code: '2CG', section: 'Humanités Commerciales', titular: 'Prof. Masamba', studentsCount: 29, capacity: 35 },
      { id: 'c4', name: '4ème Littéraire (Latin-Philo)', code: '4LP', section: 'Humanités Littéraires', titular: 'Prof. Yumba', studentsCount: 24, capacity: 30 }
    ];

    // --- COMPOSANT APPLICATION RACINE ---
    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [settings, setSettings] = useState(INITIAL_SETTINGS);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [payments, setPayments] = useState(INITIAL_PAYMENTS);
      const [classes, setClasses] = useState(INITIAL_CLASSES);
      
      // Modals
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [showStudentModal, setShowStudentModal] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');

      // Refresh icons on state change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentTab, students, payments, showPaymentModal, showStudentModal]);

      // Calculs financiers
      const totalStudents = students.length;
      const totalCollectedUSD = payments.reduce((acc, p) => acc + (p.currency === 'USD' ? p.amount : p.amount / settings.exchangeRate), 0);
      const totalDebtsUSD = students.reduce((acc, s) => acc + s.balanceUSD, 0);

      // Enregistrement d'un paiement
      const handleAddPayment = (studentId, amount, currency, motif, method) => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const amountUSD = currency === 'USD' ? Number(amount) : Number(amount) / settings.exchangeRate;

        const newPay = {
          id: 'p-' + Date.now(),
          ref: 'REC-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000),
          studentName: student.name,
          className: student.className,
          motif,
          amount: Number(amount),
          currency,
          method,
          date: new Date().toLocaleDateString('fr-FR')
        };

        setPayments([newPay, ...payments]);

        // Mise à jour de la balance élève
        setStudents(students.map(s => {
          if (s.id === studentId) {
            const newPaid = s.paidUSD + amountUSD;
            return {
              ...s,
              paidUSD: newPaid,
              balanceUSD: Math.max(0, s.tuitionUSD - newPaid)
            };
          }
          return s;
        }));

        setShowPaymentModal(false);
      };

      // Enregistrement d'un élève
      const handleAddStudent = (newS) => {
        const newStudent = {
          id: 's-' + Date.now(),
          matricule: '2025-MS-' + String(students.length + 1).padStart(3, '0'),
          status: 'ACTIF',
          tuitionUSD: 150,
          paidUSD: 0,
          balanceUSD: 150,
          ...newS
        };
        setStudents([newStudent, ...students]);
        setShowStudentModal(false);
      };

      return (
        <div className="flex h-screen w-full bg-[#F8FAFC] overflow-hidden">
          {/* SIDEBAR GAUCHE */}
          <aside className="w-64 bg-slate-900 flex-shrink-0 flex flex-col border-r border-slate-800">
            {/* LOGO */}
            <div className="p-5 border-b border-slate-800 flex items-center gap-3">
              <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-white text-lg tracking-wider shadow-lg shadow-blue-600/30">
                AKA
              </div>
              <div className="leading-tight">
                <h1 className="text-white font-bold text-base tracking-tight font-display">EduCore RDC</h1>
                <p className="text-slate-400 text-xs truncate max-w-[140px]">{settings.name}</p>
              </div>
            </div>

            {/* NAVIGATION */}
            <nav className="flex-1 overflow-y-auto p-3 space-y-1 text-xs font-semibold">
              <div className="text-[10px] uppercase font-bold text-slate-400 px-3 py-1 tracking-wider">Tableau de bord</div>
              <button 
                onClick={() => setCurrentTab('dashboard')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${currentTab === 'dashboard' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
              >
                <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                Vue d'Ensemble
              </button>

              <div className="text-[10px] uppercase font-bold text-slate-400 px-3 pt-3 py-1 tracking-wider">Scolarité & Pédagogie</div>
              <button 
                onClick={() => setCurrentTab('eleves')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${currentTab === 'eleves' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
              >
                <i data-lucide="users" className="w-4 h-4"></i>
                Registre des Élèves ({students.length})
              </button>
              <button 
                onClick={() => setCurrentTab('classes')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${currentTab === 'classes' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
              >
                <i data-lucide="school" className="w-4 h-4"></i>
                Classes & Sections ({classes.length})
              </button>
              <button 
                onClick={() => setCurrentTab('bulletins')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${currentTab === 'bulletins' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
              >
                <i data-lucide="file-text" className="w-4 h-4"></i>
                Bulletins MINEPST
              </button>

              <div className="text-[10px] uppercase font-bold text-slate-400 px-3 pt-3 py-1 tracking-wider">Finance & Caisse (RDC)</div>
              <button 
                onClick={() => setCurrentTab('finance')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${currentTab === 'finance' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
              >
                <i data-lucide="banknote" className="w-4 h-4"></i>
                Paiements & Caisse
              </button>
              <button 
                onClick={() => setCurrentTab('impayes')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${currentTab === 'impayes' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
              >
                <i data-lucide="alert-circle" className="w-4 h-4"></i>
                Suivi des Impayés
              </button>

              <div className="text-[10px] uppercase font-bold text-slate-400 px-3 pt-3 py-1 tracking-wider">Système</div>
              <button 
                onClick={() => setCurrentTab('parametres')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${currentTab === 'parametres' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
              >
                <i data-lucide="settings" className="w-4 h-4"></i>
                Configuration de l'École
              </button>
            </nav>

            {/* FOOTER USER */}
            <div className="p-4 border-t border-slate-800 bg-slate-950/40 flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-blue-600/20 border border-blue-500/30 text-blue-400 flex items-center justify-center font-bold text-xs">
                AK
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-xs font-bold text-white truncate">Abel Kabasele</p>
                <p className="text-[10px] text-slate-400 truncate">Administrateur Système</p>
              </div>
            </div>
          </aside>

          {/* CONTENU PRINCIPAL */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {/* HEADER HAUT */}
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between flex-shrink-0">
              <div className="flex items-center gap-3">
                <span className="bg-slate-100 text-slate-700 font-mono text-xs px-3 py-1 rounded-full font-bold border border-slate-200">
                  {settings.activeAcademicYear}
                </span>
                <span className="bg-blue-50 text-blue-700 text-xs px-3 py-1 rounded-full font-bold border border-blue-200">
                  {settings.currentPeriod}
                </span>
                <span className="text-xs text-slate-400 hidden md:inline">
                  Taux officiel: <strong className="text-slate-700 font-mono">1 USD = {settings.exchangeRate} CDF</strong>
                </span>
              </div>

              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setShowPaymentModal(true)}
                  className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xs transition-colors"
                >
                  <i data-lucide="plus-circle" className="w-4 h-4"></i>
                  <span>Encaisser Frais</span>
                </button>
                <button 
                  onClick={() => setShowStudentModal(true)}
                  className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xs transition-colors"
                >
                  <i data-lucide="user-plus" className="w-4 h-4"></i>
                  <span>Inscrire Élève</span>
                </button>
              </div>
            </header>

            {/* VUE ACTIVE */}
            <main className="flex-1 overflow-y-auto p-6 max-w-7xl w-full mx-auto space-y-6">
              
              {/* === VUE 1 : DASHBOARD === */}
              {currentTab === 'dashboard' && (
                <div className="space-y-6">
                  {/* STATS RAPIDES */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                      <div className="flex justify-between items-center text-slate-400 mb-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Effectif Global</span>
                        <i data-lucide="users" className="w-5 h-5 text-blue-600"></i>
                      </div>
                      <div className="text-2xl font-bold text-slate-900 font-display">{totalStudents}</div>
                      <div className="text-[11px] text-emerald-600 font-semibold mt-1">100% Inscrits & Actifs</div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                      <div className="flex justify-between items-center text-slate-400 mb-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Recettes Encaissées</span>
                        <i data-lucide="banknote" className="w-5 h-5 text-emerald-600"></i>
                      </div>
                      <div className="text-2xl font-bold text-slate-900 font-mono">${totalCollectedUSD.toLocaleString()}</div>
                      <div className="text-[11px] text-slate-500 mt-1">~ {(totalCollectedUSD * settings.exchangeRate).toLocaleString()} CDF</div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                      <div className="flex justify-between items-center text-slate-400 mb-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Reste à Recouvrer</span>
                        <i data-lucide="alert-triangle" className="w-5 h-5 text-amber-500"></i>
                      </div>
                      <div className="text-2xl font-bold text-amber-600 font-mono">${totalDebtsUSD.toLocaleString()}</div>
                      <div className="text-[11px] text-amber-700 font-semibold mt-1">Échéance Trimestre 1</div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                      <div className="flex justify-between items-center text-slate-400 mb-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Classes Ouvertes</span>
                        <i data-lucide="school" className="w-5 h-5 text-purple-600"></i>
                      </div>
                      <div className="text-2xl font-bold text-slate-900 font-display">{classes.length}</div>
                      <div className="text-[11px] text-blue-600 font-semibold mt-1">Programme MINEPST</div>
                    </div>
                  </div>

                  {/* DERNIERS PAIEMENTS ENCAISSÉS */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                      <h3 className="font-bold text-slate-900 text-sm font-display">Derniers Encaissements au Guichet</h3>
                      <button onClick={() => setCurrentTab('finance')} className="text-xs text-blue-600 font-bold hover:underline">Voir tout</button>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] tracking-wider border-b border-slate-200">
                          <tr>
                            <th className="px-6 py-3">Réf Reçu</th>
                            <th className="px-6 py-3">Élève</th>
                            <th className="px-6 py-3">Classe</th>
                            <th className="px-6 py-3">Motif</th>
                            <th className="px-6 py-3">Montant</th>
                            <th className="px-6 py-3">Mode</th>
                            <th className="px-6 py-3">Date</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {payments.map(p => (
                            <tr key={p.id} className="hover:bg-slate-50/80 transition-colors">
                              <td className="px-6 py-3.5 font-mono font-bold text-blue-600">{p.ref}</td>
                              <td className="px-6 py-3.5 font-bold text-slate-900">{p.studentName}</td>
                              <td className="px-6 py-3.5 text-slate-600">{p.className}</td>
                              <td className="px-6 py-3.5"><span className="px-2 py-0.5 bg-blue-50 text-blue-700 rounded-md font-semibold text-[11px]">{p.motif}</span></td>
                              <td className="px-6 py-3.5 font-mono font-bold text-emerald-600">
                                {p.currency === 'USD' ? `$${p.amount}` : `${p.amount.toLocaleString()} CDF`}
                              </td>
                              <td className="px-6 py-3.5 text-slate-600">{p.method}</td>
                              <td className="px-6 py-3.5 text-slate-400 font-mono text-[11px]">{p.date}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* === VUE 2 : REGISTRE DES ELEVES === */}
              {currentTab === 'eleves' && (
                <div className="space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 font-display">Registre Matricule des Élèves</h2>
                      <p className="text-xs text-slate-500">Liste officielle des élèves inscrits pour l'année {settings.activeAcademicYear}</p>
                    </div>
                    <div className="w-full sm:w-64">
                      <input 
                        type="text"
                        placeholder="Rechercher par nom ou matricule..."
                        value={searchTerm}
                        onChange={e => setSearchTerm(e.target.value)}
                        className="w-full text-xs px-3 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 shadow-xs"
                      />
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] tracking-wider border-b border-slate-200">
                          <tr>
                            <th className="px-6 py-3">Matricule</th>
                            <th className="px-6 py-3">Nom & Postnom</th>
                            <th className="px-6 py-3">Sexe</th>
                            <th className="px-6 py-3">Classe</th>
                            <th className="px-6 py-3">Responsable</th>
                            <th className="px-6 py-3">Statut Frais</th>
                            <th className="px-6 py-3 text-right">Solde Dû</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {students
                            .filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()) || s.matricule.toLowerCase().includes(searchTerm.toLowerCase()))
                            .map(s => (
                            <tr key={s.id} className="hover:bg-slate-50 transition-colors">
                              <td className="px-6 py-3.5 font-mono font-bold text-slate-500">{s.matricule}</td>
                              <td className="px-6 py-3.5 font-bold text-slate-900">{s.name}</td>
                              <td className="px-6 py-3.5 font-bold">
                                <span className={`px-2 py-0.5 rounded text-[10px] ${s.gender === 'M' ? 'bg-blue-50 text-blue-700' : 'bg-pink-50 text-pink-700'}`}>
                                  {s.gender === 'M' ? 'Garçon' : 'Fille'}
                                </span>
                              </td>
                              <td className="px-6 py-3.5 text-slate-600">{s.className}</td>
                              <td className="px-6 py-3.5 text-slate-600">
                                <div>{s.parent}</div>
                                <div className="text-[10px] text-slate-400 font-mono">{s.phone}</div>
                              </td>
                              <td className="px-6 py-3.5">
                                {s.balanceUSD === 0 ? (
                                  <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold text-[10px]">En Règle</span>
                                ) : (
                                  <span className="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-bold text-[10px]">Impayé (${s.balanceUSD})</span>
                                )}
                              </td>
                              <td className="px-6 py-3.5 text-right font-mono font-bold text-slate-900">
                                ${s.balanceUSD}
                              </td>
                            </tr>

                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* === VUE 3 : CLASSES === */}
              {currentTab === 'classes' && (
                <div className="space-y-4">
                  <h2 className="text-lg font-bold text-slate-900 font-display">Structure des Classes & Sections</h2>

                    {classes.map(c => (
                      <div key={c.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="text-[10px] font-bold uppercase tracking-wider bg-blue-50 text-blue-700 px-2 py-0.5 rounded">
                                {c.section}
                              </span>
                              <h3 className="font-bold text-slate-900 text-base mt-2 font-display">{c.name}</h3>
                              <p className="text-xs text-slate-500">Titulaire : <strong className="text-slate-700">{c.titular}</strong></p>
                            </div>
                            <span className="font-mono font-bold text-sm bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg border border-slate-200">
                              {c.code}
                            </span>
                          </div>
                        </div>

                        <div className="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs">
                          <span className="text-slate-500">Effectif actuel : <strong className="text-slate-800">{c.studentsCount} / {c.capacity} élèves</strong></span>
                          <div className="w-28 h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div className="bg-blue-600 h-full rounded-full" style={{ width: `${(c.studentsCount / c.capacity) * 100}%` }}></div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* === VUE 4 : FINANCE & CAISSE === */}
              {currentTab === 'finance' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 font-display">Journal de Caisse & Rapprochement</h2>
                      <p className="text-xs text-slate-500">Encaissements multidevises USD & Francs Congolais (CDF)</p>
                    </div>
                    <button 
                      onClick={() => setShowPaymentModal(true)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-xs flex items-center gap-2"
                    >
                      <i data-lucide="plus-circle" className="w-4 h-4"></i>
                      Encaisser un Paiement
                    </button>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] tracking-wider border-b border-slate-200">
                        <tr>
                          <th className="px-6 py-3">Reçu N°</th>
                          <th className="px-6 py-3">Date</th>
                          <th className="px-6 py-3">Élève</th>
                          <th className="px-6 py-3">Classe</th>
                          <th className="px-6 py-3">Motif</th>
                          <th className="px-6 py-3">Mode</th>
                          <th className="px-6 py-3 text-right">Montant Encaissé</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {payments.map(p => (
                          <tr key={p.id} className="hover:bg-slate-50">
                            <td className="px-6 py-3.5 font-mono font-bold text-blue-600">{p.ref}</td>
                            <td className="px-6 py-3.5 text-slate-500 font-mono text-[11px]">{p.date}</td>
                            <td className="px-6 py-3.5 font-bold text-slate-900">{p.studentName}</td>
                            <td className="px-6 py-3.5 text-slate-600">{p.className}</td>
                            <td className="px-6 py-3.5 text-slate-700">{p.motif}</td>
                            <td className="px-6 py-3.5 text-slate-600">{p.method}</td>
                            <td className="px-6 py-3.5 text-right font-mono font-bold text-emerald-600">
                              {p.currency === 'USD' ? `$${p.amount}` : `${p.amount.toLocaleString()} CDF`}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* === VUE 5 : SUIVI DES IMPAYES === */}
              {currentTab === 'impayes' && (
                <div className="space-y-4">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 font-display">État des Créances & Impayés</h2>
                    <p className="text-xs text-slate-500">Liste des élèves redevables pour le trimestre en cours</p>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] tracking-wider border-b border-slate-200">
                        <tr>
                          <th className="px-6 py-3">Matricule</th>
                          <th className="px-6 py-3">Élève</th>
                          <th className="px-6 py-3">Classe</th>
                          <th className="px-6 py-3">Contact Parent</th>
                          <th className="px-6 py-3">Total Fixé</th>
                          <th className="px-6 py-3">Déjà Payé</th>
                          <th className="px-6 py-3 text-right">Reste Dû (USD)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {students.filter(s => s.balanceUSD > 0).map(s => (
                          <tr key={s.id} className="hover:bg-slate-50">
                            <td className="px-6 py-3.5 font-mono text-slate-500">{s.matricule}</td>
                            <td className="px-6 py-3.5 font-bold text-slate-900">{s.name}</td>
                            <td className="px-6 py-3.5 text-slate-600">{s.className}</td>
                            <td className="px-6 py-3.5 text-slate-600">
                              <div>{s.parent}</div>
                              <div className="text-[10px] text-blue-600 font-mono">{s.phone}</div>
                            </td>
                            <td className="px-6 py-3.5 font-mono text-slate-500">${s.tuitionUSD}</td>
                            <td className="px-6 py-3.5 font-mono text-emerald-600 font-semibold">${s.paidUSD}</td>
                            <td className="px-6 py-3.5 text-right font-mono font-bold text-red-600">${s.balanceUSD}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* === VUE 6 : BULLETINS MINEPST === */}
              {currentTab === 'bulletins' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 font-display">Génération des Bulletins Scolaires</h2>
                      <p className="text-xs text-slate-500">Conforme au modèle officiel du Ministère de l'EPST (RDC)</p>
                    </div>
                  </div>

                  {/* APERÇU SPECIMEN BULLETIN */}
                  <div className="bg-white p-8 rounded-2xl border border-slate-300 shadow-sm max-w-3xl mx-auto space-y-6">
                    <div className="text-center border-b border-slate-200 pb-4">
                      <p className="text-[11px] uppercase font-bold text-slate-500 tracking-widest">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</p>
                      <p className="text-[10px] text-slate-400">MINISTÈRE DE L'ÉDUCATION NATIONALE ET NOUVELLE CITOYENNETÉ</p>
                      <h3 className="text-base font-bold text-slate-900 mt-2 font-display uppercase">{settings.name}</h3>
                      <p className="text-xs italic text-slate-500">"{settings.motto}"</p>
                      <p className="text-[10px] text-slate-400 mt-1">Agrément N° : {settings.nationalApprovalNumber}</p>
                    </div>

                    <div className="grid grid-cols-2 text-xs gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                      <div>Élève : <strong>KASONGO MUKENDI Daniel</strong></div>
                      <div>Matricule : <strong className="font-mono">2025-MS-001</strong></div>
                      <div>Classe : <strong>8ème Éducation de Base A</strong></div>
                      <div>Année Scolaire : <strong>{settings.activeAcademicYear}</strong></div>
                    </div>

                    <table className="w-full text-left text-xs border border-slate-200">
                      <thead className="bg-slate-100 text-slate-700 font-bold uppercase text-[10px]">
                        <tr>
                          <th className="p-2 border border-slate-200">Branches / Cours</th>
                          <th className="p-2 border border-slate-200 text-center">Max</th>
                          <th className="p-2 border border-slate-200 text-center">1ère Pér.</th>
                          <th className="p-2 border border-slate-200 text-center">2ème Pér.</th>
                          <th className="p-2 border border-slate-200 text-center">Examen</th>
                          <th className="p-2 border border-slate-200 text-center">Total Sem 1</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td className="p-2 border border-slate-200 font-semibold">Mathématiques & Algèbre</td>
                          <td className="p-2 border border-slate-200 text-center font-mono">50</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">42</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">45</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">44</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-emerald-600">131 / 150</td>
                        </tr>
                        <tr>
                          <td className="p-2 border border-slate-200 font-semibold">Français & Expression Orale</td>
                          <td className="p-2 border border-slate-200 text-center font-mono">40</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">34</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">36</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">35</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-emerald-600">105 / 120</td>
                        </tr>
                        <tr>
                          <td className="p-2 border border-slate-200 font-semibold">Sciences Physiques & TIC</td>
                          <td className="p-2 border border-slate-200 text-center font-mono">30</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">26</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">27</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-blue-600">25</td>
                          <td className="p-2 border border-slate-200 text-center font-mono font-bold text-emerald-600">78 / 90</td>
                        </tr>
                      </tbody>
                    </table>

                    <div className="flex justify-between items-center text-xs pt-4 border-t border-slate-200">
                      <div>Application : <strong>Très Bonne (TB)</strong></div>
                      <div>Conduite : <strong>Bonne (B)</strong></div>
                      <div className="font-bold text-sm text-emerald-700">Pourcentage Semestre 1 : 87.2%</div>
                    </div>
                  </div>
                </div>
              )}

              {/* === VUE 7 : PARAMÈTRES === */}
              {currentTab === 'parametres' && (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs max-w-2xl space-y-4">
                  <h2 className="text-lg font-bold text-slate-900 font-display">Paramètres & Identité de l'École</h2>
                  
                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Nom Officiel de l'Établissement</label>
                      <input 
                        type="text" 
                        value={settings.name} 
                        onChange={e => setSettings({...settings, name: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 font-semibold text-slate-900"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Devise / Slogan</label>
                      <input 
                        type="text" 
                        value={settings.motto} 
                        onChange={e => setSettings({...settings, motto: e.target.value})}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 text-slate-900"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Taux de Change (1 USD en CDF)</label>
                        <input 
                          type="number" 
                          value={settings.exchangeRate} 
                          onChange={e => setSettings({...settings, exchangeRate: Number(e.target.value)})}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 font-mono font-bold text-slate-900"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Année Scolaire Active</label>
                        <input 
                          type="text" 
                          value={settings.activeAcademicYear} 
                          onChange={e => setSettings({...settings, activeAcademicYear: e.target.value})}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 text-slate-900"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* === MODAL : NOUVEL ENCAISSEMENT === */}
          {showPaymentModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-900 text-base font-display">Encaisser un Frais Scolaire</h3>
                  <button onClick={() => setShowPaymentModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleAddPayment(
                    form.studentId.value,
                    form.amount.value,
                    form.currency.value,
                    form.motif.value,
                    form.method.value
                  );
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Sélectionner l'Élève</label>
                    <select name="studentId" required className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold">
                      {students.map(s => (
                        <option key={s.id} value={s.id}>
                          {s.name} ({s.className}) - Reste: ${s.balanceUSD}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Montant</label>
                      <input type="number" name="amount" required placeholder="ex: 150" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold" />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Devise</label>
                      <select name="currency" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold">
                        <option value="USD">USD ($)</option>
                        <option value="CDF">Franc Congolais (CDF)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Motif de paiement</label>
                    <input type="text" name="motif" defaultValue="Frais Scolaires 1er Trimestre" required className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Mode d'encaissement</label>
                    <select name="method" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                      <option value="Espèces">Espèces au Guichet</option>
                      <option value="M-Pesa">M-Pesa</option>
                      <option value="Airtel Money">Airtel Money</option>
                      <option value="Orange Money">Orange Money</option>
                      <option value="Banque (Rawbank/Equity)">Virement Bancaire</option>
                    </select>
                  </div>

                  <div className="pt-3 flex justify-end gap-2 border-t border-slate-100">
                    <button type="button" onClick={() => setShowPaymentModal(false)} className="px-4 py-2 border border-slate-200 rounded-xl font-semibold text-slate-600">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold">Valider & Imprimer Reçu</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* === MODAL : NOUVEL ELEVE === */}
          {showStudentModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-900 text-base font-display">Inscrire un Nouvel Élève</h3>
                  <button onClick={() => setShowStudentModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const selectedClass = classes.find(c => c.name === form.className.value);
                  handleAddStudent({
                    name: form.name.value,
                    gender: form.gender.value,
                    classId: selectedClass ? selectedClass.id : 'c1',
                    className: form.className.value,
                    parent: form.parent.value,
                    phone: form.phone.value
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Nom, Postnom & Prénom</label>
                    <input type="text" name="name" required placeholder="ex: KABENGELE TSHISEKEDI Paul" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Sexe</label>
                      <select name="gender" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                        <option value="M">Masculin (Garçon)</option>
                        <option value="F">Féminin (Fille)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Classe d'admission</label>
                      <select name="className" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                        {classes.map(c => (
                          <option key={c.id} value={c.name}>{c.code} - {c.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Nom du Parent / Tuteur Légal</label>
                    <input type="text" name="parent" required placeholder="ex: M. Kabengele" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Téléphone de Contact</label>
                    <input type="text" name="phone" required placeholder="ex: +243 81 000 0000" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono" />
                  </div>

                  <div className="pt-3 flex justify-end gap-2 border-t border-slate-100">
                    <button type="button" onClick={() => setShowStudentModal(false)} className="px-4 py-2 border border-slate-200 rounded-xl font-semibold text-slate-600">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold">Confirmer Inscription</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Montage de l'application React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
